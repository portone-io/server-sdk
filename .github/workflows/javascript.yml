name: JavaScript SDK

on:
  push:
    paths:
      - "javascript/**"
      - ".github/workflows/javascript.yml"
      - "codegen/openapi.json"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: Publish API reference
    needs: [check, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository.
    defaults:
      run:
        working-directory: ./javascript
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ./javascript/package.json
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: javascript/.node-version
          cache: pnpm
          cache-dependency-path: ./javascript/pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install
      - name: Run typedoc
        run: pnpm typedoc
      - name: Deploy on GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./javascript/docs
          destination_dir: js
  check:
    name: Check
    if: ${{ startsWith(github.ref, 'refs/heads') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository.
    defaults:
      run:
        working-directory: ./javascript
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ./javascript/package.json
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: javascript/.node-version
          cache: pnpm
          cache-dependency-path: ./javascript/pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install
      - name: Run biome check
        run: pnpm biome check
  test:
    name: Test
    if: ${{ startsWith(github.ref, 'refs/heads') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository.
    defaults:
      run:
        working-directory: ./javascript
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ./javascript/package.json
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: javascript/.node-version
          cache: pnpm
          cache-dependency-path: ./javascript/pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test --silent
        env:
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
  release:
    name: Release
    needs: [check, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: NPM
      url: https://www.npmjs.com/package/@portone/server-sdk
    defaults:
      run:
        working-directory: ./javascript
    permissions:
      pull-requests: write # changesets/action opens and updates the release PR.
      contents: write # changesets/action pushes the version branch; stage-npm.sh pushes the js-v tag.
      id-token: write # npm trusted publishing (staging) and provenance.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ./javascript/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # provenance requires node>=24
          node-version-file: javascript/.node-version
          cache: pnpm
          cache-dependency-path: ./javascript/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install

      - name: Create Release Pull Request or stage to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          cwd: ${{ github.workspace }}/javascript
          publish: bash scripts/stage-npm.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}

      - name: Notify Slack after successful npm staging
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RECEIPT="$RUNNER_TEMP/server-sdk-npm-stage.json"
          [[ -s "$RECEIPT" ]] || exit 0
          VERSION=$(jq -er '.version' "$RECEIPT")
          jq -n --arg version "$VERSION" '
            {
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: ("npm에 `@portone/server-sdk` 버전 *v" + $version + "* 가 스테이징되었습니다. 메인테이너의 승인(2FA) 후 배포됩니다. :hourglass_flowing_sand:\n승인: npmjs.com 패키지 페이지의 *Staged Packages* 탭 또는 `npm stage list @portone/server-sdk` → `npm stage approve <stage-id>`")}},
                {type: "actions", elements: [
                  {type: "button", text: {type: "plain_text", text: "npm 페이지 보기"}, url: "https://www.npmjs.com/package/@portone/server-sdk"},
                  {type: "button", text: {type: "plain_text", text: "체인지로그 보기"}, url: "https://github.com/portone-io/server-sdk/blob/main/javascript/CHANGELOG.md"}
                ]}
              ]
            }' |
            curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' --data-binary @- "$SLACK_WEBHOOK_URL"
