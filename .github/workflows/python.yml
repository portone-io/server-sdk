name: Python SDK

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - "codegen/openapi.json"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check
    if: ${{ startsWith(github.ref, 'refs/heads') || startsWith(github.ref, 'refs/tags/py-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository.
    defaults:
      run:
        working-directory: ./python
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "latest"
          enable-cache: true
      - name: Install Dependencies
        run: uv sync
      - name: Run ruff check
        run: uv run ruff check
  test:
    name: Test
    if: ${{ startsWith(github.ref, 'refs/heads') || startsWith(github.ref, 'refs/tags/py-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository.
    defaults:
      run:
        working-directory: ./python
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "latest"
          enable-cache: true
      - name: Install Dependencies
        run: uv sync
      - name: Run pytest
        run: uv run pytest -q
  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/py-v') }}
    needs: [check, test]
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/portone-server-sdk
    permissions:
      contents: read # Check out the repository.
      id-token: write # PyPI trusted publishing for uv publish.
    defaults:
      run:
        working-directory: ./python
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "latest"
          enable-cache: true
      - name: Install Dependencies
        run: uv sync
      - name: Replace version placeholder
        run: sed -i "s/__USER_AGENT__/$(git describe --dirty --tags --match py-v* --first-parent | cut -c 4-)/" src/portone_server_sdk/_user_agent.py
      - name: Build distribution
        run: uv build
      - name: Build distribution
        run: uv publish
      - name: Send a Slack notification if a publish happens
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          export VERSION=$(cut -c '15-' <<< "${GITHUB_REF}")
          curl -X POST -H 'Content-type: application/json'\
            --data '{"blocks":[{"type":"section","text":{"type":"mrkdwn","text":"PyPI에 `portone-server-sdk` 버전 *v'"$VERSION"'* 가 배포되었습니다 :rocket:"}},{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"PyPI 페이지 보기"},"value":"show_pypi_page","url":"https://pypi.org/project/portone-server-sdk/'"$VERSION"'","action_id":"show_pypi_page"}]}]}'\
            "$SLACK_WEBHOOK_URL"
